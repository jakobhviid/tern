[package]
name = "ternd"
description = "Background service for the tern UniFi Identity client (session + orchestration; session-bus D-Bus API)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ternd"
path = "src/main.rs"

[dependencies]
tern-core = { path = "../tern-core" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true

# Real system backends only exist on Linux; other targets (macOS/CI build hosts) use the in-memory stub.
[target.'cfg(target_os = "linux")'.dependencies]
tern-linux = { path = "../tern-linux" }
# For raising CAP_NET_ADMIN into the ambient set so execed helpers (ip/sysctl/resolvectl) inherit it.
libc = "0.2"
