name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # System libraries the desktop/Linux crates link against. Harmless for the core-only workspace today;
      # in place for when tern-gui / tern-linux land so CI keeps building without churn.
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libsecret-1-dev libdbus-1-dev
      - name: clippy (the release gate — warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  deny:
    # Enforce the licensing decision (ADR-0007) + rustls/no-OpenSSL (ADR-0001): no GPL/copyleft-only or
    # OpenSSL dependency can slip in unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
